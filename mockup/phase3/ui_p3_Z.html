<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>DJ Mixer — Phase 3 案Z 流れを描く</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/* DJ Mixer テーマと画面レイアウト。mockup/ui_mockup.src.html（打合せ7〜9で確定）から移植 */
:root{
  --bg:#0b0c0e; --panel:#15171b; --panel2:#1b1e23; --line:#2a2e35;
  --text:#e8e8e8; --dim:#8a9099; --faint:#50565f;
  --deck-a:#22d3ee; --deck-b:#fb923c;
  --wave-low:#2563eb; --wave-mid:#f59e0b; --wave-high:#f5f5f5;
  --active:#ef4444; --ok:#22c55e; --warn:#eab308;
  --mono:"Consolas","Cascadia Mono",monospace;
  /* 操作系の寸法（ユーザー要望: ボタン1.5倍・ノブ2倍） */
  --btn-h:45px; --btn-minw:66px; --btn-fs:13px;
  --big:110px; --pad-w:84px; --pad-h:60px; --knob:76px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Yu Gothic UI","Segoe UI",sans-serif;font-size:13px;user-select:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;min-width:1600px}
/* ---- header ---- */
.top{zoom:var(--u,1);height:32px;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:#08090a}
.logo{font-weight:700;letter-spacing:.18em;font-size:12px}
.logo b{color:var(--active)}
.top .sp{flex:1}
.stat{font-family:var(--mono);color:var(--dim);font-size:12px}
.stat em{font-style:normal;color:var(--text)}
/* ---- strip (固定高さ) ---- */
.strip{border-bottom:1px solid var(--line);background:var(--panel)}
.dinfo{zoom:var(--u,1);display:grid;grid-template-columns:34px 1fr auto auto auto auto;align-items:center;gap:14px;height:40px;padding:0 12px}
.dl{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;font-weight:800;color:#000}
.a .dl{background:var(--deck-a)} .b .dl{background:var(--deck-b)}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{font-size:15px;font-weight:600}.ttl span{color:var(--dim);margin-left:10px}
.bpm{font-family:var(--mono);font-size:20px;width:150px;text-align:right}
.bpm small{font-size:12px;color:var(--dim);margin-left:4px}
.key{font-family:var(--mono);font-size:14px;width:40px;text-align:center;border:1px solid var(--line);border-radius:3px;padding:2px 0}
.flags{display:flex;gap:6px;width:170px}
.flag{font-size:10px;letter-spacing:.08em;padding:3px 6px;border-radius:3px;border:1px solid var(--line);color:var(--faint)}
.flag.on{color:#fff;border-color:var(--active);background:rgba(239,68,68,.18)}
.time{font-family:var(--mono);font-size:20px;width:92px;text-align:right}
#zoom{display:block;width:100%;height:clamp(150px,20vh,260px);background:#050607}
.ovs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px 8px}
.ovs canvas{width:100%;height:34px;display:block;background:#050607;border-radius:3px}
/* ---- main: 左=タブ領域 / 右=ミックスキュー ---- */
.main{display:grid;grid-template-columns:1fr 400px;min-height:0;zoom:var(--u,1)}
.main.qhidden{grid-template-columns:1fr}.main.qhidden .queue{display:none}
.tabs .sp{flex:1}
.qnext{align-self:center;display:none;gap:10px;align-items:center;font-size:12px;color:var(--dim);margin-right:10px;white-space:nowrap}
.qnext b{color:var(--text);font-weight:600}.qnext span{font-family:var(--mono)}
.main.qhidden .qnext{display:flex}
.qtoggle{align-self:center;display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;color:var(--text);background:#16181c}
.qtoggle:hover{border-color:#4a505a}.qtoggle kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.left{display:grid;grid-template-rows:34px 1fr;min-height:0}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{padding:8px 18px;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0}
.tab.on{color:var(--text);background:var(--panel);border-color:var(--line)}
.tab.dis{color:var(--faint);cursor:default}
.tab .ph{font-size:10px;margin-left:6px;color:var(--faint)}
.view{display:none;min-height:0;overflow:auto}.view.on{display:grid}
/* ---- deck view ---- */
#deckview{grid-template-columns:1fr 400px 1fr;gap:10px;padding:10px 12px;background:var(--bg)}
.deck,.mixer{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;position:relative}
.deck.a{border-top:3px solid var(--deck-a)} .deck.b{border-top:3px solid var(--deck-b)}
.deck{display:grid;grid-template-columns:1fr 64px;gap:12px}
/* 線対称: A=テンポ左端・操作は右(中央)寄せ / B=操作は左(中央)寄せ・テンポ右端 */
.deck.a{grid-template-columns:64px 1fr}
.deck.a .dmain{align-items:flex-end;text-align:right} .deck.b .dmain{align-items:flex-start;text-align:left}
.w3{width:118px}.w4{width:76px}.w5{width:66px}.w6{width:132px}
.dmain{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:2px 0 -4px}
.btn{min-width:var(--btn-minw);height:var(--btn-h);padding:0 12px;border-radius:5px;border:1px solid #333840;
  background:linear-gradient(#262a31,#1a1d22);color:var(--text);font-size:var(--btn-fs);letter-spacing:.05em;
  cursor:pointer;display:grid;place-items:center;transition:border-color .1s}
.btn:hover{border-color:#4a505a}
.btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--active);box-shadow:0 0 0 1px var(--active) inset,0 0 10px rgba(239,68,68,.25);color:#fff}
.btn.big{width:var(--big);height:var(--big);border-radius:50%;font-size:16px;font-weight:700}
.btn.play.on{background:radial-gradient(#3b1111,#1a1d22)}
.pad{width:var(--pad-w);height:var(--pad-h);min-width:0;border-radius:6px;font-weight:700;font-size:16px}
.a .pad.set{box-shadow:0 -4px 0 var(--deck-a) inset;border-color:#5b6470}.b .pad.set{box-shadow:0 -4px 0 var(--deck-b) inset;border-color:#5b6470}
.loopbtn{min-width:0;width:54px;padding:0}
.tempo{display:flex;flex-direction:column;align-items:center;gap:6px}
.tempo .val{font-family:var(--mono);font-size:12px}
.vfader{position:relative;width:40px;height:300px;background:#0a0b0d;border:1px solid var(--line);border-radius:5px;cursor:ns-resize}
.vfader::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:2px;background:#2d3139;transform:translateX(-50%)}
.cap{position:absolute;left:-7px;width:52px;height:28px;border-radius:4px;background:linear-gradient(#50555e,#2a2e35);border:1px solid #666c76}
.cap::after{content:"";position:absolute;left:5px;right:5px;top:13px;height:2px;background:#ddd}
.phase{font-family:var(--mono);font-size:12px;color:var(--dim)}
.phase em{font-style:normal;color:var(--ok)}
/* ---- mixer: 行ごとに [A ノブ | 名前 | B ノブ] ---- */
.mixer{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;justify-items:center;row-gap:2px;align-content:start}
.mixer h4{margin:0 0 4px;font-size:15px;letter-spacing:.14em}
.mixer h4.a{color:var(--deck-a)} .mixer h4.b{color:var(--deck-b)}
.mname{font-size:16px;font-weight:600;letter-spacing:.1em;color:#c9ced6}
.knob{cursor:ns-resize;line-height:0}
.knob svg{width:var(--knob);height:var(--knob)}
.fadrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 100px 1fr;justify-items:center;align-items:end;margin-top:8px}
.meters{display:flex;gap:6px}
.vu{width:9px;height:130px;background:#0a0b0d;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.vu i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#22c55e 0%,#22c55e 65%,#eab308 82%,#ef4444 100%);background-size:100% 130px;background-position:bottom}
.chfader{height:130px}
.xf{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.hfader{position:relative;width:320px;height:40px;background:#0a0b0d;border:1px solid var(--line);border-radius:5px;cursor:ew-resize}
.hfader::before{content:"";position:absolute;top:50%;left:12px;right:12px;height:2px;background:#2d3139}
.hcap{position:absolute;top:-7px;width:30px;height:52px;border-radius:4px;background:linear-gradient(90deg,#50555e,#2a2e35);border:1px solid #666c76}
.hcap::after{content:"";position:absolute;top:5px;bottom:5px;left:13px;width:2px;background:#ddd}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg div{padding:6px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.seg div.on{background:#2a2e35;color:var(--text)}
/* ---- library ---- */
#libview{grid-template-columns:240px 1fr;gap:10px;padding:10px 12px;min-height:0}
.tree,.tbl{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto}
.tree div{padding:6px 12px;color:var(--dim);white-space:nowrap}
.tree div.on{color:var(--text);background:#22262c}
.search{padding:8px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:7px 8px;border-radius:4px;font:inherit}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#1b1e23;color:var(--dim);font-weight:500;font-size:11px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #1e2126;white-space:nowrap}
td.n{font-family:var(--mono);text-align:right}
tr:hover td{background:#1c1f24}
.cls{display:inline-block;width:18px;text-align:center;border-radius:3px;font-weight:700;font-size:11px;color:#000}
.cA{background:var(--ok)}.cB{background:var(--warn)}.cC{background:var(--active)}.cN{background:#3a3f47;color:var(--dim)}
.load{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;margin-right:4px;cursor:pointer}
.load.la{color:var(--deck-a)}.load.lb{color:var(--deck-b)}.load.lq{color:var(--text)}
/* ---- mix queue ---- */
.queue{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.qhead{padding:10px 12px;border-bottom:1px solid var(--line)}
.qhead h3{margin:0;font-size:13px;letter-spacing:.12em;display:flex;align-items:baseline;gap:10px}
.qhead h3 small{font-family:var(--mono);font-weight:400;color:var(--dim);letter-spacing:0}
.qtools{display:flex;gap:6px;margin-top:8px}
.qtools .btn{height:32px;min-width:0;font-size:12px}
.qtools .btn.dis{color:var(--faint);cursor:default}
.qlist{overflow:auto;padding:6px 8px}
.qi{display:grid;grid-template-columns:4px 22px 1fr auto;gap:8px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:7px 8px 7px 0;cursor:grab}
.qi .bar{align-self:stretch;border-radius:5px 0 0 5px;background:transparent}
.qi.onA .bar{background:var(--deck-a)} .qi.onB .bar{background:var(--deck-b)}
.qi.done{opacity:.45}
.qi.onA,.qi.onB{border-color:#3a3f47}
.qi .no{font-family:var(--mono);color:var(--dim);text-align:right;font-size:12px}
.qi .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.qi .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:11px;margin-top:1px}
.qi .meta{text-align:right;font-family:var(--mono);font-size:12px;line-height:1.35}
.qi .meta span{color:var(--dim)}
.chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--dim);font-family:"Yu Gothic UI",sans-serif;margin-left:4px}
.chip.a{color:#000;background:var(--deck-a);border-color:var(--deck-a)}
.chip.b{color:#000;background:var(--deck-b);border-color:var(--deck-b)}
.chip.next{color:var(--text);border-color:#5b6470}
.qtr{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 30px;font-size:11px;color:var(--dim);min-height:24px}
.qtr .arr{color:var(--faint)}
.qtr .ok{color:var(--ok)}.qtr .mid{color:var(--warn)}.qtr .ng{color:var(--active)}
.qtr .how{margin-left:auto;color:var(--faint)}
.qtr.cur .how{color:var(--text)}
.qfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.qfoot .btn{height:38px;font-size:12px}
.chk{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.chk i{width:14px;height:14px;border:1px solid #5b6470;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--ok)}

/* ---- 以下はアプリ本体で追加 ---- */
.empty{color:var(--faint);font-size:12px}
.qempty{padding:24px 12px;color:var(--faint);text-align:center;line-height:1.8}
.diag{font-family:var(--mono);font-size:11px;color:var(--faint)}
.diag.ng{color:var(--active)}
.qi{position:relative}
.qdel{position:absolute;right:4px;top:2px;width:18px;height:18px;display:none;place-items:center;border-radius:3px;color:var(--dim);cursor:pointer;font-size:13px;background:#2a2e35}
.qi:hover .qdel{display:grid}.qdel:hover{color:#fff;background:var(--active)}
.qi.dragging{opacity:.4}
.qi.dropbefore{box-shadow:0 -2px 0 var(--deck-a)}.qi.dropafter{box-shadow:0 2px 0 var(--deck-a)}
.qi{grid-template-columns:4px 22px 1fr auto}
/* ライブラリ */
.tree .fold{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.tree .fold span{color:var(--faint);font-family:var(--mono);font-size:11px}
.tree .fold:hover{color:var(--text)}
.tree .sec{padding:10px 12px 4px;color:var(--faint);font-size:10px;letter-spacing:.14em}
.libstatus{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;position:sticky;bottom:0;background:var(--panel)}
.tbl{position:relative}
.load:hover{border-color:#5b6470}
.load.added{color:var(--ok);border-color:var(--ok)}
.anst{font-size:11px;color:var(--faint)}
.anst.running,.anst.queued{color:var(--warn)}.anst.failed{color:var(--active)}
#flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#22262c;border:1px solid #3a3f47;color:var(--text);padding:10px 18px;border-radius:6px;font-size:13px;transition:all .2s;z-index:10}
#flash.on{opacity:1;transform:translateX(-50%) translateY(0)}
.popmenu{position:fixed;z-index:20;background:#1b1e23;border:1px solid #3a3f47;border-radius:8px;padding:10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);zoom:var(--u,1)}
.popmenu .pm-sec{font-size:11px;color:var(--dim);margin:8px 0 6px}.popmenu .pm-sec:first-child{margin-top:0}
.popmenu .pm-row{display:flex;gap:6px}.popmenu .btn{min-width:48px;height:36px;font-size:12px}
.popmenu .pm-item{padding:8px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.popmenu .pm-item:hover{background:#2a2e35}
.learning{outline:2px dashed var(--warn);outline-offset:3px;border-radius:6px}
/* 設定画面 */
#setview{padding:12px;overflow:auto}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:12px;align-content:start}
.settings section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.settings h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em}
.settings .srow{display:flex;align-items:center;gap:10px;margin:8px 0}
.settings label{width:170px;color:var(--dim)}
.settings select,.settings input{background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:4px;font:inherit;min-width:220px}
.settings input{flex:1}
.settings .btn{height:34px;min-width:0;font-size:12px}
.settings .note{color:var(--dim);font-size:12px;line-height:1.6;margin:6px 0}
.stbl{width:100%;border-collapse:collapse;font-size:12px}.stbl th,.stbl td{padding:5px 6px;border-bottom:1px solid #1e2126;text-align:left}
.stbl select{min-width:0;padding:3px 4px}
/* つなぎ目タブ（Phase 2。mockup/phase2/p2_common.css から） */
#joinview{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#joinview:not(.on){display:none}
.p2card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.p2title{display:flex;align-items:center;gap:14px}
.p2title b{font-size:18px}.p2title span{color:var(--dim)}.p2title .sp{flex:1}
.p2title .btn{height:34px;min-width:0}
canvas.cv{display:block;width:100%}
.selbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.selbar .big{font-family:var(--mono);font-size:24px;color:var(--text)}
.selbar .len{font-family:var(--mono);color:var(--dim)}
.selbar .btn{height:38px;min-width:0;font-size:13px}
.selbar input{background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:4px;font:inherit;width:260px}
.lbl2{font-size:11px;color:var(--dim);letter-spacing:.1em}
.secrow{position:relative;height:46px}
.secblk{position:absolute;top:0;bottom:0;border-radius:4px;border:1px solid rgba(255,255,255,.12);cursor:pointer;overflow:hidden;
  padding:4px 6px;font-size:11px;line-height:1.35;color:#0b0c0e;transition:filter .1s}
.secblk:hover{filter:brightness(1.15)}.secblk.sel{outline:2px solid #fff;outline-offset:-2px}
.secblk small{display:block;opacity:.75;font-family:var(--mono)}
.joins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.join h4{margin:0 0 8px;font-size:13px;font-weight:600}.join h4 span{color:var(--dim);font-weight:400}
.join .row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.join .btn{height:34px;min-width:0;font-size:12px}
.seg2{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg2 div{padding:7px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.seg2 div.on{background:#2a2e35;color:var(--text)}
.qi.cur{border-color:#8a9099;box-shadow:0 0 0 1px #8a9099 inset}
.qtr[data-join]{cursor:pointer;border-radius:4px}.qtr[data-join]:hover{background:#1c1f24}.qtr.cur{background:#22262c}
.jempty{padding:40px;color:var(--faint);text-align:center;line-height:2}
/* つなぎ目エディタ（案B。P2-6） */
.jsub{display:flex;flex-direction:column;gap:10px}.jsub[hidden]{display:none}
.jinfo{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:8px}.jinfo b{font-family:var(--mono)}
.okc{color:var(--ok)}.midc{color:var(--warn)}.ngc{color:var(--active)}
.jwarn{margin-top:8px;padding:8px 12px;border-radius:4px;background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.35);color:#facc15;font-size:13px}
.ovrow{display:grid;grid-template-columns:150px 1fr 170px;align-items:center;gap:10px;margin:4px 0}
.ovrow .who{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ovrow .who b{display:block;font-size:13px}
.ovrow .rng{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
select.tpl{background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:4px;font:inherit}
.seg2 .val{color:var(--text);font-family:var(--mono);min-width:80px;text-align:center;cursor:default}
.seg2.off{opacity:.4;pointer-events:none}
.qmix{display:flex;gap:8px}.qmix .btn{flex:1;min-width:0;font-size:13px}.qmix #qmix{flex:2}
/* Phase 2 モックアップ共通（theme.css に追加） */
.app{grid-template-rows:auto 1fr}
.p2main{display:grid;grid-template-columns:1fr 400px;min-height:0;zoom:var(--u,1)}
.p2main.noqueue{grid-template-columns:1fr}
.p2left{display:grid;grid-template-rows:34px 1fr;min-height:0}
.p2view{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.p2card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.p2title{display:flex;align-items:center;gap:14px}
.p2title b{font-size:18px}.p2title span{color:var(--dim)}
.p2title .sp{flex:1}
.p2badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#22262c;color:var(--dim);border:1px solid var(--line)}
.p2note{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;color:var(--faint);font-size:11px;pointer-events:none;white-space:nowrap}
.proposal{font-size:12px;color:#000;background:var(--warn);border-radius:3px;padding:2px 8px;font-weight:700;letter-spacing:.05em}
canvas.cv{display:block;width:100%}
.selbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.selbar .big{font-family:var(--mono);font-size:24px;color:var(--text)}
.selbar .len{font-family:var(--mono);color:var(--dim)}
.selbar .btn{height:38px;min-width:0;font-size:13px}
.selbar input{background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:4px;font:inherit;width:260px}
.lbl2{font-size:11px;color:var(--dim);letter-spacing:.1em}
.secrow{position:relative;height:46px}
.secblk{position:absolute;top:0;bottom:0;border-radius:4px;border:1px solid rgba(255,255,255,.12);cursor:pointer;overflow:hidden;
  padding:4px 6px;font-size:11px;line-height:1.35;color:#0b0c0e;transition:filter .1s}
.secblk:hover{filter:brightness(1.15)}
.secblk.sel{outline:2px solid #fff;outline-offset:-2px}
.secblk small{display:block;opacity:.75;font-family:var(--mono)}
.joins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.join h4{margin:0 0 8px;font-size:13px;font-weight:600}
.join h4 span{color:var(--dim);font-weight:400}
.join .row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.join .btn{height:34px;min-width:0;font-size:12px}
.seg2{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg2 div{padding:7px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.seg2 div.on{background:#2a2e35;color:var(--text)}
.qi.cur{border-color:#8a9099;box-shadow:0 0 0 1px #8a9099 inset}
/* Phase 3 モックアップ共通（theme.css・phase2/p2_common.css に追加） */
.anbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:13px}
.anbar .sp,.mfoot .sp{flex:1}
.anbar .btn{height:32px;min-width:0;font-size:12px}
.anbar .num{font-family:var(--mono);color:var(--text)}
.meter{height:8px;width:240px;background:#0a0b0d;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.parts{display:flex;gap:10px;flex-wrap:wrap}
.pt{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.pt i{font-style:normal;min-width:34px}
.pt b{display:inline-block;height:6px;border-radius:3px}
.cond{display:flex;flex-direction:column;gap:14px}
.cond h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.08em}
.seg2.big div{padding:9px 14px;font-size:13px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--dim);cursor:pointer;background:#0f1114}
.gchip input{display:none}
.gchip.on{color:var(--text);border-color:#8a9099;background:#22262c}
.gchip small{font-family:var(--mono);color:var(--faint)}
.seedbox{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#0a0b0d}
.seedbox b{font-size:14px}.seedbox span{color:var(--dim);font-size:12px}
.flows{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.flow{border:1px solid var(--line);border-radius:5px;padding:6px;cursor:pointer;text-align:center;font-size:12px;color:var(--dim);background:#0f1114}
.flow canvas{display:block;width:100%;height:34px}
.flow.on{border-color:#fb923c;color:var(--text);background:#22262c}
.ptabs{display:flex;gap:8px}
.ptab{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;background:#0f1114}
.ptab b{font-size:14px}.ptab div{font-size:12px;color:var(--dim);margin-top:2px}
.ptab.on{border-color:#fb923c;background:#22262c}
.tlc{display:block;width:100%;height:250px;cursor:pointer}
.tlist{display:flex;flex-direction:column;gap:2px;max-height:none}
.trow{display:grid;grid-template-columns:28px 1fr 90px 60px;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;font-size:13px}
.trow.sel{background:#22262c}
.trow .no{color:var(--faint);font-family:var(--mono)}
.trow small{color:var(--dim)}
.jrow{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:2px 8px 6px;font-size:12px;color:var(--dim)}
.jrow .why{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{height:38px;min-width:0;font-size:13px}
.btn.primary{border-color:#fb923c;color:#fff;box-shadow:0 0 0 1px #fb923c inset}
.cands{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cand{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#0f1114;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cand:hover{border-color:#8a9099}
.cand .h{display:flex;align-items:baseline;gap:8px}
.cand .h b{font-size:14px}.cand .h span{color:var(--dim);font-size:12px}
.cand .sc{margin-left:auto;font-family:var(--mono);font-size:16px}
.cand .w{font-size:12px;color:var(--dim)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.schip{flex:none;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;background:#0f1114;max-width:190px}
.schip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schip span{color:var(--dim);font-family:var(--mono)}
.schip.last{border-color:#fb923c}
.sarr{flex:none;align-self:center;color:var(--faint);font-size:11px;text-align:center}
.drawc{display:block;width:100%;height:280px;cursor:crosshair}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;width:640px;max-width:92vw;display:flex;flex-direction:column;gap:12px;zoom:var(--u,1)}
.mbox h3{margin:0;font-size:17px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:6px}
.mfoot .btn{height:36px;min-width:0}
.exopts{display:flex;flex-direction:column;gap:8px}
.exopt{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#0f1114}
.exopt input{grid-row:span 2;margin-top:3px}
.exopt span{font-size:12px;color:var(--dim);line-height:1.6}
.exopt.on{border-color:#fb923c;background:#22262c}
.exrow{display:flex;align-items:center;gap:12px;font-size:13px}
.exrow input[type=text],.exrow input:not([type]){background:#0a0b0d;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:4px;font:inherit}
.qmix{display:flex;gap:8px}.qmix .btn{flex:1;min-width:0;font-size:13px}
.jempty{padding:30px;color:var(--faint);text-align:center;line-height:2}

<script>// Phase 3 モックアップ共通（案X・Y・Z）。データは試作（work/phase3/planner_proto.py）の実際の結果。
(function () {
  const D = window.MOCK3;
  const T = D.tracks;                       // id -> 曲
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {};
  for (const n of ['--deck-a', '--deck-b', '--line', '--dim', '--faint', '--active', '--warn', '--ok', '--text', '--panel'])
    C[n] = css(n);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };
  const TPL = { long: 'ロングブレンド', short: 'ショート', echo: 'エコーアウト', bass: '低音入れ替え', filter: 'フィルター', cut: 'カット' };
  const TPL_BARS = { long: 16, short: 8, echo: 2, bass: 16, filter: 16, cut: 0 };
  const FLOWS = {
    up: { name: '上げていく', f: (x, e0) => e0 + (Math.min(1, e0 + 0.45) - e0) * x },
    keep: { name: 'キープ', f: (x, e0) => e0 },
    peak: { name: '山を作る', f: (x, e0) => e0 + 0.4 * Math.sin(Math.PI * x) },
    down: { name: '落ち着かせる', f: (x, e0) => e0 - (e0 - Math.max(0, e0 - 0.45)) * x },
  };

  function fitCanvas(cv) {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    return [g, w, h, d];
  }

  /** 並び（曲の配列 [{id, join}]）を時間軸に置く。重なりは繋ぎ方の標準の小節数。 */
  function layout(rows) {
    const L = [];
    rows.forEach((r, i) => {
      const t = T[r.id], len = t.use.t1 - t.use.t0;
      let start = 0;
      if (i > 0) {
        const p = rows[i - 1], pt = T[p.id], bars = TPL_BARS[p.join?.tpl ?? 'long'];
        const ov = Math.min(bars * 4 * 60 / pt.bpm, len * 0.4, L[i - 1].len * 0.4);
        start = L[i - 1].start + L[i - 1].len - ov;
        L[i - 1].ovOut = ov;
      }
      L.push({ r, t, start, len, ovOut: 0 });
    });
    return L;
  }

  /**
   * ミックス全体のタイムライン（Phase 2 案C を土台に）。上: 曲の帯（上下交互、小節ごとの音量の輪郭）と重なり。
   * 下: エネルギーの流れ（狙いの線と、曲ごとの実際）。返り値: クリック判定用の帯の位置。
   */
  function drawTimeline(cv, rows, { flow = null, e0 = 0.5, sel = -1, hover = -1, minutes = null, target = null } = {}) {
    const [g, W, H, d] = fitCanvas(cv);
    const L = layout(rows);
    const total = Math.max(minutes ? minutes * 60 : 0, L.length ? L[L.length - 1].start + L[L.length - 1].len : 60);
    const pad = 10 * d, X = s => pad + s / total * (W - 2 * pad);
    const laneH = 46 * d, top = 22 * d, eTop = top + 2 * laneH + 26 * d, eH = H - eTop - 18 * d;
    g.fillStyle = '#050607'; g.fillRect(0, 0, W, H);
    // 目盛り（5 分ごと）
    g.font = `${10 * d}px Consolas`;
    for (let m = 0; m * 60 <= total; m += 5) {
      const x = Math.round(X(m * 60));
      g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x, top, d, H - top - 14 * d);
      g.fillStyle = C['--faint']; g.fillText(`${m}分`, x + 3 * d, 14 * d);
    }
    const boxes = [];
    L.forEach((l, i) => {
      const lane = i % 2, y = top + lane * laneH, x0 = X(l.start), x1 = X(l.start + l.len);
      const col = lane ? C['--deck-b'] : C['--deck-a'];
      g.fillStyle = i === sel ? 'rgba(255,255,255,.14)' : i === hover ? 'rgba(255,255,255,.09)' : 'rgba(255,255,255,.05)';
      g.fillRect(x0, y + 2 * d, x1 - x0, laneH - 4 * d);
      // 小節ごとの音量の輪郭（使う範囲の中だけ）
      const t = l.t, b0 = t.use.bar0, b1 = t.use.bar1, mid = y + laneH / 2, amp = (laneH / 2 - 5 * d);
      g.beginPath(); g.moveTo(x0, mid);
      const pts = [];
      for (let b = b0; b < b1; b++) {
        const tt = (t.bars[b] ?? t.duration) - t.use.t0;
        pts.push([X(l.start + tt), (t.rms[b] ?? 0) * 0.85 + 0.08]);
      }
      pts.forEach(([x, v]) => g.lineTo(x, mid - v * amp));
      for (let k = pts.length - 1; k >= 0; k--) g.lineTo(pts[k][0], mid + pts[k][1] * amp);
      g.closePath(); g.globalAlpha = 0.75; g.fillStyle = col; g.fill(); g.globalAlpha = 1;
      if (i === sel) { g.strokeStyle = '#fff'; g.lineWidth = 2 * d; g.strokeRect(x0, y + 2 * d, x1 - x0, laneH - 4 * d); }
      // 曲名
      g.save(); g.beginPath(); g.rect(x0, y, x1 - x0, laneH); g.clip();
      g.fillStyle = '#fff'; g.font = `600 ${11 * d}px "Yu Gothic UI"`;
      g.shadowColor = '#000'; g.shadowBlur = 3 * d;
      g.fillText(`${i + 1}. ${t.title}`, x0 + 5 * d, y + 14 * d);
      g.restore();
      boxes.push({ i, x0: x0 / d, x1: x1 / d, y0: y / d, y1: (y + laneH) / d });
    });
    // 重なり（繋ぎ）
    L.forEach((l, i) => {
      if (!l.ovOut) return;
      const x0 = X(l.start + l.len - l.ovOut), x1 = X(l.start + l.len);
      const tpl = l.r.join?.tpl;
      g.fillStyle = tpl === 'echo' ? 'rgba(234,179,8,.22)' : 'rgba(34,197,94,.22)';
      g.fillRect(x0, top, x1 - x0, 2 * laneH);
      g.fillStyle = tpl === 'echo' ? C['--warn'] : C['--ok'];
      g.font = `${10 * d}px "Yu Gothic UI"`;
      g.fillText(TPL[tpl] ?? '', x0, top + 2 * laneH + 13 * d);
    });
    // エネルギーの流れ
    g.fillStyle = 'rgba(255,255,255,.03)'; g.fillRect(pad, eTop, W - 2 * pad, eH);
    g.fillStyle = C['--dim']; g.font = `${10 * d}px "Yu Gothic UI"`; g.fillText('エネルギー（上ほど盛り上がる）', pad + 4 * d, eTop + 12 * d);
    const Y = e => eTop + eH - Math.max(0, Math.min(1, e)) * (eH - 16 * d) - 4 * d;
    if (target) {                    // 手描きの線（案Z）
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2 * d; g.setLineDash([6 * d, 5 * d]); g.beginPath();
      target.forEach((e, k) => { const x = X(k / (target.length - 1) * total); k ? g.lineTo(x, Y(e)) : g.moveTo(x, Y(e)); });
      g.stroke(); g.setLineDash([]);
    } else if (flow) {
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2 * d; g.setLineDash([6 * d, 5 * d]); g.beginPath();
      for (let k = 0; k <= 60; k++) { const x = X(k / 60 * total), y = Y(FLOWS[flow].f(k / 60, e0)); k ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke(); g.setLineDash([]);
    }
    g.strokeStyle = '#fb923c'; g.lineWidth = 2.5 * d; g.beginPath();
    L.forEach((l, i) => { const x = X(l.start + l.len / 2), y = Y(l.t.energy); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    L.forEach(l => { g.fillStyle = '#fb923c'; g.beginPath(); g.arc(X(l.start + l.len / 2), Y(l.t.energy), 4 * d, 0, 7); g.fill(); });
    return { boxes, total, L, eTop: eTop / d, eH: eH / d, pad: pad / d, W: W / d };
  }

  /** 相性の内訳（テンポ・キー・響き・雰囲気）の小さな棒。 */
  function partsHTML(p) {
    const items = [['テンポ', p.tempo], ['キー', p.key], ['響き', p.chroma], ['雰囲気', p.mood]];
    return `<div class="parts">${items.map(([n, v]) => `<span class="pt"><i>${n}</i><b style="width:${Math.round(v * 44)}px;background:${v > 0.75 ? C['--ok'] : v > 0.45 ? C['--warn'] : C['--active']}"></b></span>`).join('')}</div>`;
  }
  const scoreColor = s => s > 0.8 ? C['--ok'] : s > 0.65 ? C['--warn'] : C['--active'];

  /** ミックスキュー（右側）。 */
  function renderQueue(el, rows, note = '') {
    let h = '', total = 0;
    const L = layout(rows);
    rows.forEach((r, i) => {
      const t = T[r.id];
      total = L[i].start + L[i].len;
      h += `<div class="qi"><div class="bar"></div><div class="no">${i + 1}</div><div><div class="t1">${esc(t.title)}</div>
        <div class="t2">${esc(t.artist ?? '')} ・ ${fmt(t.use.t0)}–${fmt(t.use.t1)}</div></div>
        <div class="meta">${t.bpm.toFixed(1)} <span>BPM</span><br>${t.camelot}</div></div>`;
      if (r.join) h += `<div class="qtr"><span class="arr">↓</span>${TPL[r.join.tpl]} ${TPL_BARS[r.join.tpl]}小節<span class="how" style="color:${scoreColor(r.join.score)}">相性 ${r.join.score.toFixed(2)}</span></div>`;
    });
    el.innerHTML = `<div class="qhead"><h3>ミックスキュー <small>${rows.length}曲 ・ 約${Math.round(total / 60)}分</small></h3></div>
      <div class="qlist">${h || '<div class="jempty">空です</div>'}</div>
      <div class="qfoot">${note ? `<div class="lbl2" style="color:var(--ok)">${note}</div>` : ''}
        <div class="qmix"><div class="btn" id="qmix">▶ ミックスを通して再生</div><div class="btn">■ 止める</div></div>
        <div class="btn" data-export>⤓ ミックスを書き出す…</div></div>`;
    el.querySelector('[data-export]').addEventListener('click', openExport);
  }

  // ---- 共通部品: ライブラリの解析の進み具合 ----
  function analysisBar(el) {
    const lib = D.library;
    let running = false, done = lib.analyzed, timer = null;
    const draw = () => {
      const pct = done / lib.tracks * 100, left = (lib.tracks - done) * 1.05 / 3600;
      el.innerHTML = `<div class="anbar"><b>ライブラリの解析</b>
        <div class="meter"><i style="width:${pct.toFixed(1)}%"></i></div>
        <span class="num">${done.toLocaleString()} / ${lib.tracks.toLocaleString()} 曲</span>
        <span class="lbl2">${running ? `解析中… 残り 約${left.toFixed(1)}時間（再生中は控えめに進めます）` : `おまかせは解析済みの曲から選びます。全曲で約${(lib.tracks * 1.05 / 3600).toFixed(0)}時間`}</span>
        <div class="sp"></div>
        <div class="btn" data-an>${running ? '一時停止' : done > lib.analyzed ? '続きから解析' : 'まとめて解析'}</div>
        <div class="btn" data-an-range>範囲を選んで先に解析…</div></div>`;
      el.querySelector('[data-an]').addEventListener('click', () => {
        running = !running;
        clearInterval(timer);
        if (running) timer = setInterval(() => { done = Math.min(lib.tracks, done + 37); draw(); }, 400);
        draw();
      });
      el.querySelector('[data-an-range]').addEventListener('click', () => openRange());
    };
    draw();
  }
  function openRange() {
    modal(`<h3>範囲を選んで先に解析</h3>
      <p class="lbl2" style="line-height:1.8">選んだ範囲の曲を優先して解析します。終わったら、残りの曲の解析を続けるか選べます。</p>
      <div class="gchips">${D.groups.map((g, i) => `<label class="gchip ${i === 0 ? 'on' : ''}"><input type="checkbox" ${i === 0 ? 'checked' : ''}>${g.name}<small>${g.analyzed} / ${g.total.toLocaleString()} 曲</small></label>`).join('')}</div>
      <div class="lbl2" style="margin-top:10px" data-est></div>
      <div class="mfoot"><div class="btn" data-close>キャンセル</div><div class="btn primary" data-close>この範囲を解析する</div></div>`, m => {
      const est = () => {
        const n = [...m.querySelectorAll('.gchip')].reduce((s, el, i) => s + (el.querySelector('input').checked ? D.groups[i].total - D.groups[i].analyzed : 0), 0);
        m.querySelector('[data-est]').textContent = `未解析 ${n.toLocaleString()} 曲 ・ 約${Math.max(1, Math.round(n * 1.05 / 60))}分`;
      };
      m.querySelectorAll('.gchip input').forEach(x => x.addEventListener('change', () => { x.parentElement.classList.toggle('on', x.checked); est(); }));
      est();
    });
  }

  // ---- 共通部品: 書き出し（2 方式） ----
  function openExport() {
    modal(`<h3>ミックスを書き出す</h3>
      <div class="exopts">
        <label class="exopt on"><input type="radio" name="ex" checked><b>高速で書き出す</b><span>再生せずに計算して書き出します。40 分のミックスで約 1〜2 分。<br>繋ぎは自動の動き（つなぎ目エディタの線）どおり。再生中に手で動かした操作は入りません。</span></label>
        <label class="exopt"><input type="radio" name="ex"><b>再生しながら録音する</b><span>「ミックスを通して再生」の音をそのまま録音します。ミックスの長さだけ時間がかかります（40 分なら 40 分）。<br>再生中に手で動かしたフェーダーやつまみも、そのまま入ります。</span></label>
      </div>
      <div class="exrow"><span class="lbl2">形式</span><div class="seg2"><div class="on">WAV（劣化なし）</div><div>MP3 320kbps</div><div>MP3 192kbps</div></div></div>
      <div class="exrow"><span class="lbl2">保存先</span><input value="G:\\MIX\\2026-09-30 おまかせ（上げていく）.wav" style="flex:1"></div>
      <div class="exrow"><span class="lbl2">曲の区切り</span><label><input type="checkbox" checked> 曲目リスト（開始時刻つき）も書き出す</label></div>
      <p class="lbl2" style="line-height:1.7">書き出したミックスは個人で楽しむ範囲でお使いください。</p>
      <div class="mfoot"><div class="btn" data-close>キャンセル</div><div class="btn primary" data-go>書き出す</div></div>`, m => {
      m.querySelectorAll('.exopt input').forEach(x => x.addEventListener('change', () => m.querySelectorAll('.exopt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked))));
      m.querySelectorAll('.seg2 div').forEach(x => x.addEventListener('click', () => m.querySelectorAll('.seg2 div').forEach(o => o.classList.toggle('on', o === x))));
      m.querySelector('[data-go]').addEventListener('click', () => {
        const fast = m.querySelector('.exopt input').checked;
        const f = m.querySelector('.mfoot');
        let p = 0;
        f.innerHTML = `<div class="meter" style="flex:1"><i style="width:0%"></i></div><span class="lbl2" data-p></span>`;
        const iv = setInterval(() => {
          p = Math.min(100, p + (fast ? 4 : 0.6));
          f.querySelector('.meter i').style.width = p + '%';
          f.querySelector('[data-p]').textContent = fast ? `書き出し中 ${Math.round(p)}%（残り 約${Math.round((100 - p) * 0.9)}秒）` : `録音中 ${fmt(p / 100 * 2400)} / 40:00（再生しています）`;
          if (p >= 100) { clearInterval(iv); f.innerHTML = `<span style="color:var(--ok)">書き出しました（モックアップのため実際のファイルはできません）</span><div class="sp"></div><div class="btn" data-close>閉じる</div>`; f.querySelector('[data-close]').addEventListener('click', close); }
        }, 120);
      });
    });
  }

  let modalEl = null;
  function close() { modalEl?.remove(); modalEl = null; }
  function modal(html, bind) {
    close();
    modalEl = document.createElement('div');
    modalEl.className = 'mback';
    modalEl.innerHTML = `<div class="mbox">${html}</div>`;
    document.body.appendChild(modalEl);
    modalEl.addEventListener('click', e => { if (e.target === modalEl || e.target.closest('[data-close]')) close(); });
    bind?.(modalEl);
  }

  function applyScale() {
    const u = Math.max(0.85, Math.min(1.5, innerWidth / 1920, innerHeight / 1080));
    document.documentElement.style.setProperty('--u', u.toFixed(3));
  }
  addEventListener('resize', applyScale); applyScale();

  window.P3 = { D, T, C, esc, fmt, TPL, TPL_BARS, FLOWS, fitCanvas, layout, drawTimeline, partsHTML, scoreColor, renderQueue, analysisBar, openExport, modal, close };
})();
</script>
<script>
const { D, T, C, esc, fmt, TPL, fitCanvas, drawTimeline, scoreColor, renderQueue, analysisBar, layout } = P3;
const N = 41;                                        // 40 分を 1 分刻み
let curve = Array.from({ length: N }, (_, k) => 0.5 + 0.3 * Math.sin(Math.PI * k / (N - 1)));
let result = null;
renderQueue(document.getElementById('queue'), D.plans.queue[1].tracks);
analysisBar(document.getElementById('an'));
const seed = T[D.seed];
document.getElementById('seed').innerHTML = `<div><b>${esc(seed.title)}</b> <span>${esc(seed.artist)}</span></div><div class="sp" style="flex:1"></div><div class="btn" style="height:30px;min-width:0;font-size:12px">変更…</div>`;
document.getElementById('groups').innerHTML = D.groups.slice(0, 6).map((g, i) => `<label class="gchip ${i === 0 ? 'on' : ''}"><input type="checkbox" ${i === 0 ? 'checked' : ''}>${g.name}</label>`).join('');
document.querySelectorAll('#groups input').forEach(x => x.addEventListener('change', () => x.parentElement.classList.toggle('on', x.checked)));

const cv = document.getElementById('draw');
function drawCanvas() {
  const [g, W, H, d] = fitCanvas(cv), pad = 30 * d;
  g.fillStyle = '#050607'; g.fillRect(0, 0, W, H);
  const X = k => pad + k / (N - 1) * (W - 2 * pad), Y = e => H - pad - e * (H - 2 * pad);
  g.font = `${10 * d}px Consolas`;
  for (let m = 0; m <= 40; m += 5) { const x = Math.round(X(m)); g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x, pad, d, H - 2 * pad); g.fillStyle = C['--faint']; g.fillText(`${m}分`, x - 8 * d, H - 10 * d); }
  g.fillStyle = C['--dim']; g.font = `${11 * d}px "Yu Gothic UI"`;
  g.fillText('盛り上がる', 4 * d, pad + 4 * d); g.fillText('静か', 4 * d, H - pad);
  // 描いた線
  g.strokeStyle = '#fb923c'; g.lineWidth = 3 * d; g.lineJoin = 'round'; g.beginPath();
  curve.forEach((e, k) => k ? g.lineTo(X(k), Y(e)) : g.moveTo(X(k), Y(e))); g.stroke();
  g.fillStyle = 'rgba(251,146,60,.12)'; g.beginPath(); g.moveTo(X(0), Y(0));
  curve.forEach((e, k) => g.lineTo(X(k), Y(e))); g.lineTo(X(N - 1), Y(0)); g.closePath(); g.fill();
  // 結果の曲の位置（実際のエネルギー）
  if (result) {
    const L = layout(result.tracks), total = 40 * 60;
    L.forEach((l, i) => {
      const x = pad + (l.start + l.len / 2) / total * (W - 2 * pad), y = Y(l.t.energy);
      g.fillStyle = i % 2 ? C['--deck-b'] : C['--deck-a']; g.beginPath(); g.arc(x, y, 5 * d, 0, 7); g.fill();
      g.fillStyle = '#e8e8e8'; g.font = `${10 * d}px "Yu Gothic UI"`; g.fillText(`${i + 1}`, x - 3 * d, y - 8 * d);
    });
  }
  return { X, Y, pad, W, H, d };
}
let drawing = false, lastK = null;
function paint(ev) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, pad = 30;
  const k = Math.round(Math.max(0, Math.min(1, (ev.clientX - r.left - pad) / (r.width - 2 * pad))) * (N - 1));
  const e = Math.max(0, Math.min(1, 1 - (ev.clientY - r.top - pad) / (r.height - 2 * pad)));
  if (lastK !== null && lastK !== k) { const [a, b] = lastK < k ? [lastK, k] : [k, lastK]; const ea = curve[lastK]; for (let j = a; j <= b; j++) curve[j] = ea + (e - ea) * (j - lastK) / (k - lastK); }
  curve[k] = e; lastK = k; drawCanvas();
}
cv.addEventListener('pointerdown', ev => { drawing = true; lastK = null; cv.setPointerCapture(ev.pointerId); paint(ev); });
cv.addEventListener('pointermove', ev => drawing && paint(ev));
cv.addEventListener('pointerup', () => { drawing = false; lastK = null; });
const PRE = { up: k => 0.35 + 0.5 * k, peak: k => 0.4 + 0.45 * Math.sin(Math.PI * k), wave: k => 0.5 + 0.25 * Math.sin(2 * Math.PI * k * 2 - Math.PI / 2) + 0.1 * k, down: k => 0.8 - 0.5 * k };
document.querySelectorAll('[data-pre]').forEach(b => b.addEventListener('click', () => { curve = curve.map((_, k) => PRE[b.dataset.pre](k / (N - 1))); drawCanvas(); }));

// 描いた線に一番近い試作の結果を選ぶ（本番は線をそのまま目標にして探索する）
function nearestPlan() {
  let best = null;
  for (const flow of ['up', 'keep', 'peak', 'down']) for (const p of D.plans[flow]) {
    const L = layout(p.tracks), total = 40 * 60;
    let err = 0;
    L.forEach(l => { const k = Math.min(N - 1, Math.round((l.start + l.len / 2) / total * (N - 1))); err += (l.t.energy - curve[k]) ** 2; });
    err = Math.sqrt(err / L.length);
    if (!best || err < best.err) best = { p, err };
  }
  return best;
}
document.getElementById('go').addEventListener('click', () => {
  const b = nearestPlan();
  result = b.p;
  document.getElementById('res').style.display = '';
  document.getElementById('rsum').textContent = `${result.tracks.length}曲 ・ 約${Math.round(result.minutes)}分 ・ 平均の相性 ${result.score.toFixed(2)} ・ 描いた線とのずれ ${b.err.toFixed(2)}`;
  drawTimeline(document.getElementById('tl'), result.tracks, { target: curve, minutes: 40 });
  document.getElementById('mini').innerHTML = result.tracks.map((r, i) => { const t = T[r.id]; return `<div><span>${i + 1}</span><b style="font-weight:500">${esc(t.title)} <small style="color:var(--dim)">${esc((t.artist ?? '').slice(0, 30))}</small></b><span>${t.bpm.toFixed(1)}</span><span>${t.camelot}</span></div>`; }).join('');
  drawCanvas();
});
document.getElementById('toq').addEventListener('click', () => renderQueue(document.getElementById('queue'), result.tracks, 'キューに入れました。つなぎ目タブで直せます'));
addEventListener('resize', () => { drawCanvas(); if (result) drawTimeline(document.getElementById('tl'), result.tracks, { target: curve, minutes: 40 }); });
drawCanvas();
</script>
</body></html>
